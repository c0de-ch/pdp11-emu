<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel preview (dev)</title>
<link rel="stylesheet" href="../assets/css/panel.css">
<style>
  html, body { margin: 0; background: #0d0e10; }
  #host { position: relative; margin: 0; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.5; }
</style>
</head>
<body>
<!--
  Static preview of the front panel for visual comparison with the reference
  photo (no server needed). Query parameters:
    w=1340          panel width in px
    state=photo     lamps, paddles and knobs as in r4's bb_composite photo (default),
          all       lamp test (every lamp lit),  dark  (all lamps off),
          rest      no paddle moved, lamps dark,
          up        every switch that rises is raised, lamps dark,
          down      every switch that presses is pressed, lamps dark
    hover=<name>    highlight a paddle as under the pointer (e.g. EXAM)
    overlay=<url>   overlay an image at 50 % opacity (e.g. the reference photo)
    photo=<url>     draw r4's BlinkenBone composite photo (pw = its width in px,
                    default 1340) under the panel in the panel's mm frame;
                    alpha=0..1 panel opacity
    branding=0      hide the logo and bezel branding
-->
<div id="host"></div>
<script type="module">
  import { FrontPanel, loadGeometry } from '../assets/js/panel/panel.js';

  const q = new URLSearchParams(location.search);
  const host = document.getElementById('host');
  host.style.width = `${q.get('w') || 1340}px`;
  if (q.get('photo')) {
    // Draw the photo into the panel's millimetre frame with r4's affine fit
    // of the 2950 px BlinkenBone composite (scaled for the given image width),
    // then put the panel on top at the given opacity.
    const w = +(q.get('w') || 1340);
    const pw = +(q.get('pw') || 1340);
    const k = 2950 / pw;
    const wrap = document.createElement('div');
    wrap.style.cssText = `position:relative;width:${w}px`;
    wrap.innerHTML = `<svg viewBox="-10.1 -9.9 484.4 260.4" style="position:absolute;inset:0;width:100%;height:100%">` +
      `<image href="${q.get('photo')}" width="${pw}" transform="matrix(${0.170202 * k} ${-0.000395 * k} ${-0.000427 * k} ${0.169181 * k} -19.013 -24.5)"/></svg>`;
    document.body.prepend(wrap);
    wrap.append(host);
    host.style.opacity = q.get('alpha') ?? 0.5;
  }
  const geo = await loadGeometry('../assets/panel/geometry.json');
  await document.fonts.load('600 10px "Archivo Panel"');
  const panel = new FrontPanel(host, geo, { send: (m) => console.log('send', JSON.stringify(m)) });
  window.panel = panel;
  const state = q.get('state') || 'photo';
  const frame = new Uint8Array(64);
  const none = { LOAD_ADRS: false, EXAM: false, DEP: false, CONT: false, START: false };
  const base = { sr: 0, enableHalt: 'enable', sinstSbus: 'inst', addrKnob: 1, dataKnob: 3, key: 'power', lampTest: false, pressed: none };
  if (state === 'photo') {
    frame.fill(255);
    panel.setServerControls({
      ...base, sr: (1 << 20) | (1 << 18) | (1 << 14) | (1 << 2), pressed: { ...none, EXAM: true, DEP: true },
    });
  } else if (state === 'all') {
    frame.fill(255);
    panel.setServerControls(base);
  } else if (state === 'up') {
    panel.setServerControls({ ...base, sr: 0o17777777, lampTest: true, pressed: { ...none, DEP: true } });
  } else if (state === 'down') {
    panel.setServerControls({
      ...base, enableHalt: 'halt', sinstSbus: 'bus', pressed: { ...none, LOAD_ADRS: true, EXAM: true, CONT: true, START: true },
    });
  } else {
    panel.setServerControls(base);
  }
  panel.setFrame(frame);
  if (q.get('branding') === '0') panel.setBranding(false);
  if (q.get('hover')) panel.view.setHover(q.get('hover'), true);
  if (q.get('overlay')) {
    const img = document.createElement('img');
    img.id = 'overlay';
    img.src = q.get('overlay');
    host.append(img);
  }
  document.body.dataset.ready = '1';
</script>
</body>
</html>
