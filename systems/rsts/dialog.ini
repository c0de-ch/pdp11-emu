; INIT's boot dialogue. Answers are typed 0.25 s after each prompt
; (-t after=250000 microseconds) so that RSTS has posted its read.
; "Option:" -> LF (^J) starts timesharing.
expect "Option: " send -t after=250000,"\n"; continue
; The saved memory table never matches SimH's memory: LF accepts the new one.
expect "Table suboption? " send -t after=250000,"\n"; continue
; RSTS/E V7 is not Y2K-ready: %DATE_19XX_YY% is the 19xx year whose calendar
; matches today's.
expect "DD-MMM-YY? " send -t after=250000,"%DATE_DD%-%DATE_MMM%-%DATE_19XX_YY%\r"; continue
expect "12:00 PM? " send -t after=250000,"%TIME_HH%:%TIME_MM%\r"; continue
; Default start-up command file; -c clears any rule that did not fire.
expect -c "Command File Name? " send -t after=250000,"\r"; continue
