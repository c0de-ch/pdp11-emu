; 2.11BSD patch level 482 (Chase Covello's PiDP-11 distribution) on one RA disk
; (1000 MB, MSCP/UDA50 at 172150, vector 154). pdp11d's header sets the CPU
; (11/70, 4 MB), speed, console and panel export.
set rq enabled
set rq0 rauser=1000
attach -e rq0 ${DISK0}
set rl disabled
set rp disabled
set tq disabled
set xu disabled
; The PIDP11 kernel was built with a second DL11 ("cn 1" at 176500, vector 300),
; so its DZ11 is at vector 310. Enabling one DLI line makes SimH's autoconfig
; move the DZ there by itself (an explicit "set dz vector=" would switch
; autoconfig off for every device configured after it).
set dli enabled
set dli lines=1
set dz enabled
set dz lines=8
set dz 7b
