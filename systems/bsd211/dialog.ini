; Skip the 5 s "Press <CR> to boot, or any other key to abort" countdown of the
; 2.11BSD boot loader (persistent: a "reboot" from inside 2.11BSD gets it too).
expect -p "Press <CR> to boot" send "\r"; continue
; After an unclean stop "fsck -p" can meet an inconsistency it may not repair
; alone ("UNEXPECTED INCONSISTENCY; RUN fsck MANUALLY") and leaves a root shell
; with no one to answer it, and "power off and boot again" ends at the same
; shell. Repair and reboot; -n: no sync, the kernel's copy of a repaired root is
; stale. Persistent: any boot can need it.
expect -p "Automatic reboot failed... help!\r\nerase, kill ^U, intr ^C\r\n# " send delay=20000,"fsck -y; reboot -n\r"; continue
