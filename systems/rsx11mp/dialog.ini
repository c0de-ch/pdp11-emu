; STARTUP.CMD asks for the time and date. RSX-11M-PLUS V3.0 is not Y2K-ready:
; %DATE_19XX_YY% is the 19xx year whose calendar matches today's. The answer is
; typed 0.25 s after the prompt (-t after=250000 microseconds): with SimH's
; default (1000 instructions) RSX may not have posted its read yet and hands
; the line to MCR instead.
expect "Please enter time and date (HH:MM DD-MMM-YY) [S]: " send -t after=250000,"%TIME_HH%:%TIME_MM% %DATE_DD%-%DATE_MMM%-%DATE_19XX_YY%\r"; continue
