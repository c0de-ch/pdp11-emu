; RSX-11M-PLUS V3.0 BL24 (w11 OS kit rsx11mp-30_rpset) on one RP06.
; The V3.0 secondary bootstrap takes an 11/70 red-stack trap (handled by the
; OS); SimH treats that as a stop condition unless STOP_TRAPS is cleared.
deposit STOP_TRAPS 0
set rp0 rp06
attach -e rp0 ${DISK0}
set rq disabled
set tq disabled
; The SYSGEN has a second DL11 (TT1: at 176500, vector 300) and a DZ11
; (TT2:-TT11:) at vector 310. Enabling one DLI line makes SimH's autoconfig
; move the DZ from 300 to 310; without it the DZ lines never answer.
set dli enabled
set dli lines=1
set dlo0 7b
set dz enabled
set dz lines=8
set dz 7b
