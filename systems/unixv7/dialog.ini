; The RP boot block prints nothing: type "boot" to start the second-stage
; loader (a SEND issued before the boot command survives the boot reset).
send after=2000000,delay=20000,"boot\r"
; Second-stage loader prompt ":" -> load the kernel from RP0.
expect ": " send delay=20000,"hp(0,0)unix\r"; continue
; The kernel comes up single-user ("# "): set the clock (V7's date takes
; yymmddhhmm with a 19xx year: %DATE_19XX_YY% is the 19xx year whose calendar
; matches today's), then Ctrl+D continues to multi-user.
expect "# " send delay=20000,"date %DATE_19XX_YY%%DATE_MM%%DATE_DD%%TIME_HH%%TIME_MM%\r\004"; continue
