; 2.11BSD patch level 499 (Johnny Billquist's pidp kernel) on one RA disk
; (1024 MB, MSCP/UDA50 at 172150, vector 154). pdp11d's header sets the CPU
; (11/70, 4 MB), speed, console and panel export.
set rq enabled
set rq0 rauser=1024
attach -e rq0 ${DISK0}
set rl disabled
set rp disabled
set tq disabled
set xu disabled
; DZ11 at SimH's default 160100, vector 300 (what /etc/dtab expects).
set dz enabled
set dz lines=8
set dz 7b
; The pidp kernel counts 50 clock ticks per second: with SimH's default 60 Hz
; KW11-L its clock gains 12 s a minute.
set clk 50hz
