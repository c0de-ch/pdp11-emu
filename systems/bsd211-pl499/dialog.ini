; Skip the 5 s "Press <CR> to boot, or any other key to abort" countdown of the
; 2.11BSD boot loader (persistent: a "reboot" from inside 2.11BSD gets it too).
expect -p "Press <CR> to boot" send "\r"; continue
; First boot only: the image ships with rc_configured=NO, so /etc/rc refuses the
; automatic multi-user boot and init leaves a root shell on the console. At that
; shell set rc_configured=YES, also switch off sendmail, the one daemon rc.conf
; ships switched on (rwhod, named, ntp, ntpd and timed are already NO, the address
; settings stay commented out), and reboot, so that the normal path with fsck runs.
; rc.conf stays changed: later boots never see this prompt.
expect -p "boot aborted.\r\nerase, kill ^U, intr ^C\r\n# " send "sed -e 's/^rc_configured=NO/rc_configured=YES/' -e 's/^sendmail=YES/sendmail=NO/' /etc/rc.conf > /tmp/rc.conf && cp /tmp/rc.conf /etc/rc.conf && sync && reboot\r"; continue
; After an unclean stop "fsck -p" can meet an inconsistency it may not repair
; alone ("UNEXPECTED INCONSISTENCY; RUN fsck MANUALLY") and leaves a root shell
; with no one to answer it, and "power off and boot again" ends at the same
; shell. Repair and reboot; -n: no sync, the kernel's copy of a repaired root is
; stale. Persistent: any boot can need it.
expect -p "Automatic reboot failed... help!\r\nerase, kill ^U, intr ^C\r\n# " send delay=20000,"fsck -y; reboot -n\r"; continue
