; First boot only: the distribution disk starts the RT11AI installation
; dialogue. RETURN, NO (no automatic installation) and RETURN make RT-11 copy
; the RT11FB bootstrap to the disk and reboot it as a working RT-11FB volume;
; later boots go straight to RT-11FB.
expect -p 'Press the "RETURN" key when ready to continue. ' send "\r"; continue
expect '(Type YES or NO and press the "RETURN" key): ' send "NO\r"; continue
; Every boot: STARTF.COM types V5USER.TXT; at the first KMON prompt after it set
; the date and time. RT-11 V5.3 only accepts 1972-1999: %DATE_19XX_YY% is the
; 19xx year whose calendar matches today's. -c clears the rules above.
expect -c "TYPED or PRINTED.\r\n\r\n\r\n." send delay=20000,"DATE %DATE_DD%-%DATE_MMM%-%DATE_19XX_YY%\rTIME %TIME_HH%:%TIME_MM%:%TIME_SS%\r"; continue
